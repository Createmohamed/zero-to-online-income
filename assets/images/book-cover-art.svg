<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 852" width="600" height="852">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241d18"/>
      <stop offset="55%" stop-color="#14110e"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#D2673F" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#D2673F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="852" fill="url(#bg)"/>
  <rect width="600" height="852" fill="url(#glow)"/>

  <!-- fine rule grid, editorial mark -->
  <g stroke="#F4EBDD" stroke-opacity=".06" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="852"/>
    <line x1="0" y1="620" x2="600" y2="620"/>
  </g>

  <!-- concentric publishing motif, lower right -->
  <g transform="translate(430,700)" fill="none" stroke="#B84A2A" stroke-opacity=".35">
    <circle r="140" stroke-width="1"/>
    <circle r="100" stroke-width="1"/>
    <circle r="60" stroke-width="1"/>
  </g>
  <circle cx="430" cy="700" r="4" fill="#D2673F" fill-opacity=".5"/>

  <!-- sunrise stack, upper right — echoes the cover seal -->
  <g transform="translate(478,150)">
    <path d="M -46 0 A46 46 0 0 1 46 0 Z" fill="#F4EBDD" fill-opacity=".05"/>
    <path d="M -30 34 A30 30 0 0 1 30 34 Z" fill="#F4EBDD" fill-opacity=".07"/>
  </g>

  <!-- fine diagonal hatch, spine side -->
  <g stroke="#F4EBDD" stroke-opacity=".035" stroke-width="1">
    <line x1="0" y1="40" x2="140" y2="180"/>
    <line x1="0" y1="90" x2="90" y2="180"/>
    <line x1="0" y1="140" x2="40" y2="180"/>
  </g>
</svg>
