<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#141010"/>
      <stop offset="45%" stop-color="#0A0908"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
    <radialGradient id="bloom" cx="74%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#B84A2A" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#B84A2A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241d18"/>
      <stop offset="55%" stop-color="#14110e"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F4EBDD"/>
      <stop offset="100%" stop-color="#D9CDB8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>

  <!-- the book, standing right -->
  <g transform="translate(830,120)">
    <rect x="248" y="8" width="18" height="384" rx="3" fill="url(#pages)"/>
    <rect x="0" y="0" width="256" height="400" rx="4" fill="url(#cover)"/>
    <rect x="0" y="0" width="256" height="400" rx="4" fill="none" stroke="#F4EBDD" stroke-opacity=".10"/>
    <text x="26" y="44" font-family="Menlo, monospace" font-size="11" letter-spacing="3"
          fill="#F4EBDD" fill-opacity=".5">MOHAMED FAHIM</text>
    <circle cx="222" cy="40" r="17" fill="none" stroke="#F4EBDD" stroke-opacity=".3"/>
    <text x="222" y="45" text-anchor="middle" font-family="Menlo, monospace" font-size="11"
          fill="#F4EBDD" fill-opacity=".6">01</text>
    <text x="26" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#F4EBDD">Zero to</text>
    <text x="26" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#F4EBDD">Online</text>
    <text x="26" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#F4EBDD">Income</text>
    <rect x="26" y="366" width="76" height="2" fill="#B84A2A"/>
  </g>

  <!-- title block, left -->
  <text x="88" y="118" font-family="Menlo, monospace" font-size="15" letter-spacing="5"
        fill="#F4EBDD" fill-opacity=".45">A DIGITAL BOOK · EDITION 01</text>

  <text x="88" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="104" fill="#F4EBDD">Zero to</text>
  <text x="88" y="368" font-family="Georgia, 'Times New Roman', serif" font-size="104" fill="#F4EBDD">Online</text>
  <text x="88" y="468" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-style="italic" fill="#D2673F">Income.</text>

  <rect x="88" y="512" width="620" height="1" fill="#F4EBDD" fill-opacity=".16"/>

  <text x="88" y="556" font-family="Helvetica, Arial, sans-serif" font-size="21"
        fill="#F4EBDD" fill-opacity=".72">The practical digital product selling playbook</text>
  <text x="88" y="586" font-family="Menlo, monospace" font-size="14" letter-spacing="3"
        fill="#F4EBDD" fill-opacity=".45">MOHAMED FAHIM · $19</text>
</svg>
